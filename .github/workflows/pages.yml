name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: oxipng cache (ADR-391)
        uses: actions/cache@v4
        with:
          path: .cache/oxipng
          key: oxipng-9.1.5-o2-${{ hashFiles('packages/assets/pack/**/*.png', 'assets/**/*.png', 'apps/client/src/**/*.png') }}
          restore-keys: oxipng-9.1.5-o2-
      - name: Build client (offline mode, Pages base)
        working-directory: apps/client
        env:
          BASE: /SurVivaZ/
          VITE_DEFAULT_OFFLINE: "1"
          SURVIVAZ_OXIPNG: required
        run: pnpm exec vite build
      - name: Dist size guard and built-dist replay (ADR-395)
        env:
          SURVIVAZ_OXIPNG: required
          SURVIVAZ_DIST: apps/client/dist
        run: node scripts/check-dist-size.mjs apps/client/dist && pnpm exec vitest run apps/client/test/adr395_dist.test.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

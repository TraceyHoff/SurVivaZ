name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: oxipng cache (ADR-391)
        uses: actions/cache@v4
        with:
          path: .cache/oxipng
          key: oxipng-9.1.5-o2-${{ hashFiles('packages/assets/pack/**/*.png', 'assets/**/*.png', 'apps/client/src/**/*.png') }}
          restore-keys: oxipng-9.1.5-o2-
      - run: pnpm check
      - run: pnpm -r build
        env:
          SURVIVAZ_OXIPNG: required
      - name: Dist size guard and built-dist replay (ADR-395)
        env:
          SURVIVAZ_OXIPNG: required
          SURVIVAZ_DIST: apps/client/dist
        run: node scripts/check-dist-size.mjs apps/client/dist && pnpm exec vitest run apps/client/test/adr395_dist.test.ts apps/client/test/adr396_icon_paths.test.ts
